server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

	# Não declarar um bloco `types` aqui: ele substituiria a tabela MIME inteira
	# herdada do http{} (e todo o resto viraria application/octet-stream).

	# Assets imutáveis com hash no nome: cache agressivo
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Shell, service worker e manifest nunca podem ficar presos em cache —
	# errar isso deixa o usuário preso numa versão antiga do app
	location = /index.html {
		add_header Cache-Control "no-cache";
	}
	location = /sw.js {
		add_header Cache-Control "no-cache";
	}
	location = /manifest.webmanifest {
		# extensão .webmanifest não existe na mime.types padrão do nginx
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
	}

	# Fallback de SPA: rotas dinâmicas ([id], [token]) caem no shell
	location / {
		try_files $uri $uri/ /index.html;
	}
}
