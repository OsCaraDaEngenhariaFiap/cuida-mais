server:
  port: 8080

spring:
  application:
    name: cuida
  profiles:
    default: dev

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2LWN1aWRhLWhzMjU2LWtleS0yMDI2IXg=}
  expiration: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger
