services:
  # Dev com HMR: docker compose up web → http://localhost:5173
  web:
    build:
      context: .
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      # volume anônimo por cima do bind mount: preserva o node_modules do container
      - /app/node_modules
      # HTTPS local com mkcert (opção 2 do README): descomente junto com server.https no vite.config.ts
      # - ./certs:/app/certs:ro

  # Build de produção servido por nginx: docker compose up preview → http://localhost:8080
  preview:
    build:
      context: .
      target: prod
    ports:
      - '8080:80'
